<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TradingView Futures Chart</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      background-color: #121418;
      color: #ffffff;
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
    }

    /* Market Watch / Coin Selector */
    .market-selector {
      margin-bottom: 15px;
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .market-selector label {
      font-weight: bold;
    }

    .market-selector select, .market-btn {
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid #333;
      background-color: #1e222d;
      color: #fff;
      cursor: pointer;
    }

    .market-btn:hover {
      background-color: #2a2e39;
    }

    /* TradingView Container */
    .tradingview-widget-container {
      height: 500px;
      width: 100%;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #2a2e39;
    }
  </style>

  <!-- TradingView Library JS -->
  <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
</head>
<body>

  <div class="container">
    <h2>Futures Trading Chart</h2>

    <!-- লাইভ মার্কেট থেকে কয়েন সিলেক্ট করার ডেমো প্যানেল -->
    <div class="market-selector">
      <label for="coinSelect">Select Coin from Live Market:</label>
      <select id="coinSelect" onchange="changeSymbol(this.value)">
        <option value="BZUSDT">BZUSDT (Brent Crude Oil)</option>
        <option value="BTCUSDT">BTCUSDT (Bitcoin)</option>
        <option value="ETHUSDT">ETHUSDT (Ethereum)</option>
        <option value="SOLUSDT">SOLUSDT (Solana)</option>
        <option value="BNBUSDT">BNBUSDT (BNB)</option>
      </select>

      <!-- দ্রুত সিলেক্ট করার জন্য ডেমো বাটন -->
      <button class="market-btn" onclick="changeSymbol('BZUSDT')">BZ/USDT</button>
      <button class="market-btn" onclick="changeSymbol('BTCUSDT')">BTC/USDT</button>
      <button class="market-btn" onclick="changeSymbol('ETHUSDT')">ETH/USDT</button>
    </div>

    <!-- ট্রেডিংভিউ চার্ট রেন্ডার হওয়ার কন্টেইনার -->
    <div id="tradingview_chart" class="tradingview-widget-container"></div>
  </div>

  <script type="text/javascript">
    let tvWidget = null;

    // কয়েন ফরম্যাট ঠিক করার ফাংশন (Futures Perpetual এর জন্য .P যুক্ত করবে)
    function formatFuturesSymbol(rawSymbol) {
      if (!rawSymbol) return "BINANCE:BTCUSDT.P";
      
      // স্পেস বা অপ্রয়োজনীয় ক্যারেক্টার বাদ দেওয়া
      let cleanSymbol = rawSymbol.trim().toUpperCase().replace('/', '');

      // যদি ইতিমধ্যে BINANCE: দিয়ে শুরু হয় তবে তা বাদ দিয়ে শুধু সিম্বল রাখা
      if (cleanSymbol.startsWith("BINANCE:")) {
        cleanSymbol = cleanSymbol.replace("BINANCE:", "");
      }

      // যদি ফিউচারের সাফিক্স '.P' না থাকে, তবে যুক্ত করা
      if (!cleanSymbol.endsWith(".P")) {
        cleanSymbol = cleanSymbol + ".P";
      }

      return "BINANCE:" + cleanSymbol;
    }

    // চার্ট লোড বা আপডেট করার ফাংশন
    function loadTradingViewWidget(symbolName) {
      const formattedSymbol = formatFuturesSymbol(symbolName);

      // আগের চার্ট থাকলে তা ক্লিয়ার করা
      document.getElementById('tradingview_chart').innerHTML = '';

      tvWidget = new TradingView.widget({
        "autosize": true,
        "symbol": formattedSymbol,
        "interval": "5",
        "timezone": "Etc/UTC",
        "theme": "dark",
        "style": "1",
        "locale": "en",
        "toolbar_bg": "#f1f3f6",
        "enable_publishing": false,
        "allow_symbol_change": true,
        "container_id": "tradingview_chart"
      });
    }

    // ইউজার অন্য কোনো কয়েন সিলেক্ট করলে এই ফাংশন কল হবে
    function changeSymbol(newSymbol) {
      loadTradingViewWidget(newSymbol);
    }

    // পেজ প্রথমবার লোড হওয়ার সময় ডিফল্ট কয়েন (BZUSDT) নিয়ে চার্ট চালু হবে
    window.onload = function() {
      const initialSymbol = document.getElementById('coinSelect').value || 'BZUSDT';
      loadTradingViewWidget(initialSymbol);
    };
  </script>

</body>
</html>
